<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineApp - Gerenciador de Filmes</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

    
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
            <div class="container">
                
                <a class="navbar-brand text-warning" href="#">
                    <i class="bi bi-film"></i> CineApp
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegação">
                    <span class="navbar-toggler-icon"></span>
                </button>

                
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" href="#">
                                <i class="bi bi-collection-play me-1"></i>Listar filmes
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/filmes/cadastrar">
                                <i class="bi bi-plus-circle me-1"></i> Cadastrar filme
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

<main class="container my-5">

    <div class="row row-cols-1 row-cols-md-3 g-4">
    {% for filme in lista_filmes %}
    <div class="col">
        <div class="card h-100 shadow-sm">
            <div class="card-body">
                <span class="badge bg-primary mb-2">{{ filme.genero }}</span>
                <h5 class="card-title">{{ filme.titulo }}</h5>
                <p class="card-text text-muted">{{ filme.sinopse }}</p>
            </div>
            <div class="card-footer bg-transparent border-top-0 d-flex justify-content-between">
                <small class="text-muted">Ano: {{ filme.ano }}</small>
                <small class="text-muted">ID: #{{ filme.id }}</small>
            </div>
        </div>
    </div>
    {% else %}
    <div class="col-12">
        <div class="alert alert-info" role="alert">
            Nenhum filme cadastrado até o momento.
        </div>
    </div>
    {% endfor %}
</div>
</main>

    

    <footer class="footer-custom py-3 text-center mt-auto">
        <div class="container">
            <small>&copy; CineApp. Sistema de Gerenciamento de Filmes.</small>
        </div>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
