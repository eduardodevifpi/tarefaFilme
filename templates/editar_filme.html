<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineApp - Editar Filme</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
            <div class="container">
                <a class="navbar-brand text-warning" href="#">
                    <i class="bi bi-film"></i> CineApp
                </a>
            </div>
        </nav>
    </header>


    <main class="container my-5">

        <section id="editar-filme" class="bg-white p-4 rounded-3 shadow-sm border">
            <h3 class="h4 text-secondary mb-3">Editar Filme</h3>
            
            <form action="/filmes/editar/{{ filme.id }}" method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="titulo" class="form-label">Título do Filme</label>
                        <input type="text" name="titulo" class="form-control" id="titulo" value="{{ filme.titulo }}" required>
                    </div>

                    <div class="col-md-6">
                        <label for="ano" class="form-label">Ano de Lançamento</label>
                        <input type="number" name="ano" class="form-control" id="ano" value="{{ filme.ano }}" min="1895" max="2100" required>
                    </div>

                    <div class="col-12 text-end">
                        <a href="/filmes" class="btn btn-outline-secondary me-2">Cancelar</a>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-lg me-1"></i> Atualizar Filme
                        </button>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <footer class="footer-custom py-3 text-center mt-auto">
        <div class="container">
            <small>&copy; CineApp. Sistema de Gerenciamento de Filmes.</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
