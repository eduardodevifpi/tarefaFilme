<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineApp - Gerenciador de Filmes</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

    
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
            <div class="container">
                
                <a class="navbar-brand text-warning" href="#">
                    <i class="bi bi-film"></i> CineApp
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegação">
                    <span class="navbar-toggler-icon"></span>
                </button>

                
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" href="#">
                                <i class="bi bi-collection-play me-1"></i>Listar filmes
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                <i class="bi bi-plus-circle me-1"></i> Cadastrar filme
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>


    <main class="container my-5">

        <section id="cadastrar-filme" class="bg-white p-4 rounded-3 shadow-sm border">
            <h3 class="h4 text-secondary mb-3">Cadastrar Novo Filme</h3>
            
            <form action="/filmes/cadastrar" method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="titulo" class="form-label">Título do Filme</label>
                        <input type="text" name="titulo" class="form-control" id="titulo" placeholder="Ex: O Poderoso Chefão" required>
                    </div>

                    <div class="col-md-6">
                        <label for="ano" class="form-label">Ano de Lançamento</label>
                        <input type="number" name="ano" class="form-control" id="ano" placeholder="2024" min="1895" max="2100" required>
                    </div>

                    <div class="col-12 text-end">
                        <button type="reset" class="btn btn-outline-secondary me-2">Limpar</button>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-lg me-1"></i> Salvar Filme
                        </button>
                    </div>
                </div>
            </form>
        </section>
    </main>

    

    <footer class="footer-custom py-3 text-center mt-auto">
        <div class="container">
            <small>&copy; CineApp. Sistema de Gerenciamento de Filmes.</small>
        </div>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
